[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-home-workout"
version = "0.1.0"
description = "Initial API foundation for an AI-powered home workout platform"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["app/tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
